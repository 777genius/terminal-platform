name: npm-publish

run-name: terminal-platform node npm ${{ inputs.source_ref || github.ref_name }}${{ inputs.dry_run == false && ' -> publish' || ' -> dry run' }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: terminal-platform ref to publish, for example v0.3.3 (empty = current branch)
        required: false
        type: string
        default: ''
      dry_run:
        description: Pack and smoke the package without publishing to npm
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: terminal-platform-npm-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-package:
    name: build-${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: win32-x64
            runner: windows-latest
          - platform: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install Zellij
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ZELLIJ_BIN_DIR="$(python .github/scripts/install_zellij.py --out "$RUNNER_TEMP/zellij-bin")"
          echo "$ZELLIJ_BIN_DIR" >> "$GITHUB_PATH"

      - name: Install Zellij
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $binDir = python .github/scripts/install_zellij.py --out "$env:RUNNER_TEMP\zellij-bin"
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package smoke against staged layout
        run: cargo test -p terminal-node-napi --test package_smoke

      - name: Build staged node package
        shell: bash
        run: |
          node crates/terminal-node-napi/package/scripts/build-local-package.mjs \
            --release \
            --out "$RUNNER_TEMP/terminal-platform-node"

      - name: Verify staged node package
        shell: bash
        run: |
          node crates/terminal-node-napi/package/scripts/verify-package.mjs \
            --package-dir "$RUNNER_TEMP/terminal-platform-node"

      - name: Upload staged node package artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal-platform-node-${{ matrix.platform }}
          path: ${{ runner.temp }}/terminal-platform-node
          retention-days: 3

  publish-package:
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    outputs:
      package_version: ${{ steps.version.outputs.version }}
      dry_run: ${{ inputs.dry_run == true }}

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Download staged packages
        uses: actions/download-artifact@v7
        with:
          pattern: terminal-platform-node-*
          path: ${{ runner.temp }}/staged

      - name: Merge staged packages into one multi-target package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ARGS=()
          for staged_dir in "$RUNNER_TEMP"/staged/terminal-platform-node-*; do
            PACKAGE_ARGS+=("--package" "$staged_dir")
          done
          node crates/terminal-node-napi/package/scripts/merge-staged-packages.mjs \
            --out "$RUNNER_TEMP/terminal-platform-node" \
            "${PACKAGE_ARGS[@]}"

      - name: Verify merged package
        shell: bash
        run: |
          node crates/terminal-node-napi/package/scripts/verify-package.mjs \
            --package-dir "$RUNNER_TEMP/terminal-platform-node"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require(process.env.RUNNER_TEMP + '/terminal-platform-node/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack package tarball
        shell: bash
        run: |
          npm pack "$RUNNER_TEMP/terminal-platform-node" \
            --pack-destination "$RUNNER_TEMP/dist" \
            --verbose

      - name: Install smoke in a clean project
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SMOKE_DIR="$RUNNER_TEMP/install-smoke"
          TARBALL="$RUNNER_TEMP/dist/terminal-platform-node-$VERSION.tgz"

          test -f "$TARBALL"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          npm init --yes >/dev/null
          npm install "$TARBALL"

          node --input-type=commonjs -e "
            const mod = require('terminal-platform-node');
            const binding = mod.loadNativeBinding();
            if (typeof binding.TerminalNodeClient !== 'function') {
              throw new Error('binding did not expose TerminalNodeClient');
            }
            if (typeof binding.TerminalNodeSubscription !== 'function') {
              throw new Error('binding did not expose TerminalNodeSubscription');
            }
            console.log('cjs binding ok:', binding.bindingVersion ? 'with bindingVersion' : 'loaded');
          "

          node --input-type=module -e "
            import { TerminalNodeClient } from 'terminal-platform-node';
            if (typeof TerminalNodeClient !== 'function') {
              throw new Error('esm export did not expose TerminalNodeClient');
            }
            console.log('esm export ok');
          "

      - name: Upload package tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: terminal-platform-node-${{ steps.version.outputs.version }}.tgz
          path: ${{ runner.temp }}/dist/*.tgz
          retention-days: 3

      - name: Publish to npm
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="$RUNNER_TEMP/dist/terminal-platform-node-$VERSION.tgz"

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Missing NPM_TOKEN secret; cannot publish. Set it with: gh secret set NPM_TOKEN --repo $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          npm publish "$TARBALL" --access public --provenance

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## terminal-platform-node npm run"
            echo ""
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- dry run: \`${{ inputs.dry_run == true }}\`"
            echo "- tarball artifact: \`terminal-platform-node-${{ steps.version.outputs.version }}.tgz\`"
          } >> "$GITHUB_STEP_SUMMARY"
